# LLM annotation protocol, amendment 1 (README): model IDs and settings.
# provider: openai (Responses API), compat (OpenAI-compatible chat API), anthropic, google, local.
# Settings not listed are left at the provider default; what is actually sent is logged per call.

# Amendment 5: the OpenAI and DeepSeek models also go through OpenRouter, pinned the same way.
gpt-6-astra:
  provider: compat
  model: openai/gpt-6-astra
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  extra_body:                    # lowest level; "none" not supported, no custom temperature
    reasoning: {effort: low}
    provider: {order: [openai], allow_fallbacks: false, require_parameters: true}

gpt-6-luna:
  provider: compat
  model: openai/gpt-6-luna
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  extra_body:                    # no temperature through OpenRouter: provider default (amendment 5)
    reasoning: {effort: none}
    provider: {order: [openai], allow_fallbacks: false, require_parameters: true}

# Amendment 4: Claude, Gemini and qwen4-max go through OpenRouter (one key), each pinned to the
# model maker's own backend, no fallback to another backend, only backends that accept every parameter.
claude-opus-5-5:
  provider: compat
  model: anthropic/claude-opus-5.5
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  extra_body:                    # thinking cannot be switched off; lowest effort. No sampling parameters (amendment 3)
    reasoning: {effort: low}
    provider: {order: [anthropic], allow_fallbacks: false, require_parameters: true}

claude-haiku-5-5:
  provider: compat
  model: anthropic/claude-haiku-5.5
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  extra_body:                    # thinking off; no sampling parameters (amendment 3)
    reasoning: {enabled: false}
    provider: {order: [anthropic], allow_fallbacks: false, require_parameters: true}

qwen4-max:
  provider: compat
  model: qwen/qwen4-max
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  temperature: 0
  extra_body:                    # thinking off
    reasoning: {enabled: false}
    provider: {order: [alibaba], allow_fallbacks: false, require_parameters: true}

qwen3.8-27b:
  provider: local                # self-hosted on the NAISS GPU (scripts/gpu_label_job.sh)
  model: Qwen/Qwen3.8-27B
  enable_thinking: false         # greedy decoding

gemini-4-carbon:
  provider: compat
  model: google/gemini-4-carbon
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  extra_body:                    # lowest thinking level; temperature is ignored by the model
    reasoning: {effort: low}
    provider: {order: [google-ai-studio], allow_fallbacks: false, require_parameters: true}

deepseek-v4-pro:
  provider: compat
  model: deepseek/deepseek-v4-pro-0813   # GA snapshot; the one DeepSeek itself serves on OpenRouter (amendment 5)
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  temperature: 0
  extra_body:                    # non-thinking mode
    reasoning: {enabled: false}
    provider: {order: [deepseek], allow_fallbacks: false, require_parameters: true}
